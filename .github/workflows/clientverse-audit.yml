name: ClientVerse Audit

# Integration only. Scanners and release decisions belong to the centralized
# ClientVerse Website Audit & Release Certification System.
# Project configuration: qa-config/clientverse-audit.yaml.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Immutable deployment URL serving this exact workflow commit"
        required: false
        default: ""

concurrency:
  group: clientverse-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  central-audit:
    name: Centralized ClientVerse audit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      CLIENTVERSE_ENDPOINT: ${{ vars.CLIENTVERSE_ENDPOINT }}
      DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || vars.CLIENTVERSE_DEPLOYMENT_URL }}
      COMMIT_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the integration is configured
        env:
          CLIENTVERSE_TOKEN: ${{ secrets.CLIENTVERSE_TOKEN }}
        run: node scripts/clientverse-audit.mjs --preflight

      # ClientVerse audit BLOCKED is a failing result, never a skipped success.
      # POST acceptance is queued work. Poll for completion and retain the
      # exact-candidate evidence before accepting the central APPROVED decision.
      - name: Request centralized audit
        env:
          CLIENTVERSE_TOKEN: ${{ secrets.CLIENTVERSE_TOKEN }}
        run: node scripts/clientverse-audit.mjs

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientverse-audit-evidence
          path: clientverse-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release gate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('clientverse-evidence/result.json', 'utf8'));
          if (result.release_gate !== 'APPROVED' || result.audit_completed !== true) {
            throw new Error('ClientVerse: not a certified pass');
          }
          console.log('Completed central audit and evidence verified: APPROVED');
          NODE
