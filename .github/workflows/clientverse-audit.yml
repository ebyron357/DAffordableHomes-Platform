name: ClientVerse Audit

# Integration layer only. Discovery, browser/accessibility/performance/security
# testing, findings normalization, repair policy enforcement, verification and
# evidence reporting are owned by the centralized ClientVerse Website Audit &
# Release Certification System. This workflow notifies that system, preserves
# the evidence it returns, and enforces its release gate.
#
# Do not add Playwright, Lighthouse, axe, Lychee, Semgrep, or other scanner
# logic here. Project-specific audit configuration lives in
# qa-config/clientverse-audit.yaml.
#
# Supersedes PR #18 and incorporates PR #24's release-only trigger contract.
# Two corrections to the original draft:
#   1. It exited 0 with a notice when CLIENTVERSE_ENDPOINT was unset, so an
#      unconfigured integration reported a green check. This workflow reports
#      BLOCKED and fails instead — an audit that never ran is not a pass.
#   2. It audited whatever CLIENTVERSE_DEPLOYMENT_URL happened to hold. This
#      workflow requires a resolved deployment URL and records the exact commit
#      SHA that URL is expected to serve.

on:
  # ClientVerse certifies a deployable release target. Ordinary PR validation
  # must not fail merely because production-only credentials are unavailable.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to audit (Vercel preview or production URL)"
        required: false
        default: ""

concurrency:
  group: clientverse-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  central-audit:
    name: Centralized ClientVerse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve audit target
        id: target
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.deployment_url }}
          VAR_URL: ${{ vars.CLIENTVERSE_DEPLOYMENT_URL }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          url="${INPUT_URL:-$VAR_URL}"
          {
            echo "deployment_url=$url"
            echo "commit_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Commit under audit: $COMMIT_SHA"
          echo "Deployment URL:     ${url:-<unset>}"

      - name: Verify the integration is configured
        id: preflight
        shell: bash
        env:
          ENDPOINT: ${{ vars.CLIENTVERSE_ENDPOINT }}
          TOKEN: ${{ secrets.CLIENTVERSE_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ENDPOINT" ]       || missing+=("CLIENTVERSE_ENDPOINT (repository variable)")
          [ -n "$TOKEN" ]          || missing+=("CLIENTVERSE_TOKEN (repository secret)")
          [ -n "$DEPLOYMENT_URL" ] || missing+=("CLIENTVERSE_DEPLOYMENT_URL (repository variable) or the deployment_url input")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ClientVerse audit: BLOCKED"
              echo ""
              echo "The centralized audit could not run because the integration is not configured."
              echo "Missing configuration:"
              echo ""
              for item in "${missing[@]}"; do echo "- \`$item\`"; done
              echo ""
              echo "Configure these under **Settings → Secrets and variables → Actions**, then re-run."
              echo "This check fails deliberately: an audit that never executed is not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::ClientVerse audit BLOCKED — missing: ${missing[*]}"
            exit 1
          fi
          echo "All ClientVerse configuration is present."

      - name: Request centralized audit
        id: audit
        shell: bash
        env:
          CLIENTVERSE_ENDPOINT: ${{ vars.CLIENTVERSE_ENDPOINT }}
          CLIENTVERSE_TOKEN: ${{ secrets.CLIENTVERSE_TOKEN }}
          COMMIT_SHA: ${{ steps.target.outputs.commit_sha }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p clientverse-evidence
          # Central service accepts an asynchronous certification request at /api/audits.
          # Never interpret HTTP 202 as an approved release.
          jq -n --arg repository "$REPOSITORY" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg application_path "apps/web" \
            --arg policy_version "2026-08-25" \
            '{repository: $repository, commit_sha: $commit_sha, deployment_url: $deployment_url, application_path: $application_path, policy_version: $policy_version}' \
            > clientverse-evidence/request.json
          status_code="$(curl -sS --max-time 60 -o clientverse-evidence/submission.json -w '%{http_code}' \
            -X POST "${CLIENTVERSE_ENDPOINT%/}/api/audits" \
            -H "Authorization: Bearer ${CLIENTVERSE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @clientverse-evidence/request.json)" || status_code="000"
          echo "$status_code" > clientverse-evidence/submission-http-status.txt
          if [ "$status_code" != "202" ]; then
            echo "::error::ClientVerse submission failed (HTTP $status_code)"
            exit 1
          fi
          audit_id="$(jq -er '.audit_id | select(type == "string" and startswith("aud_"))' clientverse-evidence/submission.json)"
          echo "audit_id=$audit_id" >> "$GITHUB_OUTPUT"
          echo "Audit accepted: $audit_id (not yet certified)"
          # Poll the authenticated server-side verdict. The job deadline is 20 min.
          end=$((SECONDS + 780))
          while [ "$SECONDS" -lt "$end" ]; do
            status_code="$(curl -sS --max-time 20 -o clientverse-evidence/status.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLIENTVERSE_TOKEN}" \
              "${CLIENTVERSE_ENDPOINT%/}/api/audits/$audit_id")" || status_code="000"
            echo "$status_code" > clientverse-evidence/poll-http-status.txt
            if [ "$status_code" != "200" ]; then
              echo "::error::ClientVerse status read failed (HTTP $status_code)"
              exit 1
            fi
            state="$(jq -r '.status // "UNKNOWN"' clientverse-evidence/status.json)"
            verdict="$(jq -r '.decision // "UNKNOWN"' clientverse-evidence/status.json)"
            if [ "$state" = "completed" ] || [ "$state" = "error" ]; then
              echo "Central audit finished: state=$state decision=$verdict"
              echo "gate=$verdict" >> "$GITHUB_OUTPUT"
              evidence_status="$(curl -sS --max-time 60 -o clientverse-evidence/evidence.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CLIENTVERSE_TOKEN}" \
                "${CLIENTVERSE_ENDPOINT%/}/api/audits/$audit_id/evidence")" || evidence_status="000"
              echo "$evidence_status" > clientverse-evidence/evidence-http-status.txt
              if [ "$evidence_status" != "200" ]; then
                echo "::error::Unable to retain certified audit evidence (HTTP $evidence_status)"
                exit 1
              fi
              # Never print raw response bodies: findings and evidence may be sensitive.
              if [ "$state" != "completed" ]; then exit 1; fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::ClientVerse audit timed out before a final decision"
          exit 1

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientverse-audit-evidence
          path: clientverse-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce release gate
        shell: bash
        env:
          GATE: ${{ steps.audit.outputs.gate }}
          COMMIT_SHA: ${{ steps.target.outputs.commit_sha }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
        run: |
          set -euo pipefail
          {
            echo "## ClientVerse audit"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Release gate: \`$GATE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Only an explicit pass is a pass. UNKNOWN and UNPARSEABLE mean the
          # central system did not certify this release, so they fail too.
          case "$GATE" in
            PASS|PASSED|APPROVED|CERTIFIED|OK)
              echo "ClientVerse release gate satisfied."
              ;;
            *)
              echo "::error::ClientVerse release gate is '$GATE' — not a certified pass."
              exit 1
              ;;
          esac
